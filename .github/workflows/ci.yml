name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: linkvault
          POSTGRES_PASSWORD: linkvault
          POSTGRES_DB: linkvault
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U linkvault -d linkvault"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://linkvault:linkvault@localhost:5432/linkvault
      RATE_LIMIT_MAX: "30"
      RATE_LIMIT_WINDOW_SECONDS: "3600"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
